# Team customization for bmad-build-auto (the unattended / "yolo" build loop).
#
# Committed to the repo: applies to every developer and every CI run.
# Personal overrides go in `_bmad/custom/bmad-build-auto.user.toml` (gitignored).
#
# Merge rules (from the skill's customize.toml):
#   strings replace, lists append, tables merge key by key,
#   arrays of tables merge by `id`.
#
# Why this file exists: the shipped `bmad-build-auto` is generic. This project
# has a stricter policy than the skill's defaults (branch per story, a review
# gate before the merge, two fix/review cycles per story), and the skill must
# carry those rules as facts for the whole unattended run.
#
# This policy was changed on 2026-10-29: the merge is now automatic. The
# human review of every pull request was replaced by the skill's own
# four-layer review plus the four project verifications, both re-run by
# `tools/build-loop.py` before the merge. The operating procedure lives in
# `docs/unattended-loop.md`.

[workflow]

# Facts kept in context for the whole run.
persistent_facts = [
  "Politica del repositorio LAN Party Hub, vigente para toda la historia de este run: una rama por historia (`story/<epica>-<historia>-<slug>`) creada desde `main` ya actualizado con las historias anteriores; la revision que precede a la fusion es la automatica de las cuatro capas del propio skill, no una revision humana; el bucle externo `tools/build-loop.py` abre el PR y lo fusiona; nunca push directo a `main`; nunca fusionar a `main` desde la rama de la historia; nunca anadir atribucion de IA a los commits.",
  "Reparto de responsabilidades: este skill es el dueno del codigo (planifica, implementa, revisa en cuatro capas, parchea, verifica y deja un commit en la rama) pero NO es el dueno del control de versiones: no hace push, no abre PR y no fusiona. Eso es tarea del driver externo `tools/build-loop.py`, que ademas vuelve a pasar los cuatro comandos de verificacion del proyecto antes de abrir el PR. La historia siguiente no se planifica hasta que el PR de esta historia esta fusionado en `main`.",
  "Este run es desatendido: NO pidas decisiones a una persona, NO esperes aprobaciones y NO preguntes nada. Si el diseño está abierto, resuélvelo con la espina de arquitectura y con los AC de la historia, y deja la decisión escrita en el spec. Si de verdad no se puede decidir con la evidencia disponible, HALT con estado `blocked` y una condición concreta, y sigue.",
  "No enumeres el árbol de ficheros ni leas los artefactos de planeamiento en crudo: carga el contexto de la épica compilado (`epic-<N>-context.md`), que es lo que exige el paso 01, y excluye siempre `bin/` y `obj/` al buscar ficheros. Si el run se queda sin contexto, no abandones la historia: deja el spec escrito en el disco con lo que tengas y termina; el driver continúa la misma sesión.",
  "El diff de la revisión se escribe DENTRO del proyecto, en `.build-loop/diffs/<historia>.diff`, NUNCA en el directorio temporal del sistema: leer de fuera del workspace pide un permiso que en un run desatendido no tiene quién lo conceda, y el revisor se queda colgado esperando la respuesta. El diff de la revisión es `git diff <baseline_revision>` (todo el cambio de la historia desde su base), NUNCA `git diff --cached`: el trabajo de la historia puede estar commiteado, porque el driver commitea el trabajo pendiente para que no se pierda. Un diff staged vacío significa que has calculado mal el diff.",
  "Puerta de fusion: la historia anterior debe estar ya fusionada en `main` antes de empezar la siguiente. Si al arrancar este run la historia anterior sigue sin fusionar, HALT con estado `blocked` y condicion `previous story not merged into main`. El driver externo satisface esta puerta fusionando el PR de la historia anterior antes de lanzar la siguiente.",
  "Limite de ciclos de correccion y revision: como maximo DOS ciclos automaticos por historia (docs/plan.md seccion 8). Si el workflow propone un tercer ciclo, HALT con estado `blocked` y condicion `project cycle cap reached` en lugar de continuar. No reabrir un hallazgo ya resuelto sin evidencia nueva.",
  "Una historia no puede declararse completada con un hallazgo de severidad bloqueante sin resolver: si el triage deja diferido un hallazgo `high` (equivalente a S0/S1 en la escala de docs/plan.md seccion 8), HALT con estado `blocked` y condicion `blocking severity finding deferred`. Un hallazgo `high (unverified)` viene de un `maybe-false`, no de un defecto confirmado: no bloquea, pero el driver lo copia al cuerpo del PR.",
  "Verificacion obligatoria antes de cerrar la historia, los cuatro en verde: `dotnet build LANPartyHub.sln`; `dotnet test LANPartyHub.sln`; `powershell -NoProfile -File tools/check-encoding.ps1`; `powershell -NoProfile -File tools/check-epics.ps1`.",
  "Documentacion y explicaciones en espanol; identificadores, nombres de tipo, miembros, contratos tecnicos y comentarios de codigo en ingles. Identificadores opacos UUID v7, fechas en UTC, `sizeBytes` en bytes exactos.",
  "Fuentes de verdad: la espina de arquitectura `_bmad-output/planning-artifacts/architecture/architecture-lan-party-hub-2026-10-26/ARCHITECTURE-SPINE.md` (AD-1..AD-34) manda en las decisiones tecnicas, y el backlog `_bmad-output/planning-artifacts/epics/epics-lan-party-hub-2026-10-26/epics.md` manda en el alcance. Léelos antes de tocar un contrato o una entidad.",
  "Los diferidos se registran en la lista `deferred:` del frontmatter del propio spec de la historia, no en `deferred-work.md`. Cada diferido lleva su severidad (`high`, `medium` o `low`): un diferido sin severidad bloquea la fusion automatica.",
  "El MVP no es P2P: ninguna dependencia de MonoTorrent ni de biblioteca de transferencia P2P, y ninguna referencia al vocabulario de peer, swarm, tracker o seeding en el dominio.",
]

# Extra instructions to run after config is loaded and before step 01.
activation_steps_append = [
  "Antes del paso 01, comprueba que el arbol de trabajo esta limpio y que la rama actual corresponde a la historia de este run. Si el arbol esta sucio, HALT con estado `blocked` y condicion `dirty working tree`. No cambies de rama, no crees ramas, no hagas push, no abras PR y no fusiones en ningun punto del run: la rama la creo el driver externo para esta historia y el push, el PR y el merge son suyos.",
]

# Instruction run by HALT after writing the terminal result.
on_complete = "Publica en el chat el hash del commit, la rama, el story key y el resultado de los cuatro comandos de verificacion, y detente. No hagas push, no abras PR y no fusiones: el driver externo `tools/build-loop.py` se encarga del push, del PR y del merge. La historia siguiente no se planifica hasta que el PR de esta historia este fusionado en `main`: ese es el punto de control del bucle, y ahora lo ejecuta el driver en vez de una persona."

# Las capas de revision se redefinen aqui para dos motivos que el repo ha
# suffered: el diff de una historia grande llega a 400 kB, y la ruta del
# fichero temporal puede venir en forma corta 8.3, en cuyo caso el revisor
# acababa listando el directorio temporal entero y la peticion se colgaba.

[[workflow.review_layers]]
id = "blind-hunter"
name = "Blind Hunter"
instruction = """
Launch a context-free subagent with this prompt:

Conduct a review of CONTENT.
Look for what's missing, not only what's wrong.
Compute your finding floor N from the diff file's size: N = min(floor(sqrt(kB) + 1), 10), where kB is the file's size in kilobytes. State the arithmetic in one line, then find at least N issues to fix or improve.
Output a Markdown list of findings only — no severity, priority, or ranking.
If the content is empty, stop and say so.
If you have zero findings, re-check and keep thinking; do not stop with an empty list.

CONTENT: the unified diff at `{diff_file}`. Read that file — it is the content under review.

READING RULES, THEY ARE NOT OPTIONAL: the diff lives INSIDE the project, under `.build-loop/diffs/`; read it from there with the read tool using offset and limit, in slices of at most 400 lines, and keep going until you have covered it. Never read anything outside the project: a read outside the workspace asks for a permission that nobody grants in an unattended run, and the review hangs waiting for the answer.

Do not invoke any skill, and do not spawn subagents of your own — you are the reviewer. Return your findings as text in your final message; do not route them through any findings-reporting tool the host may offer.

"""

[[workflow.review_layers]]
id = "edge-case-hunter"
name = "Edge Case Hunter"
instruction = """
Launch a context-free subagent with this prompt:

Read `{skill-root}/review-prompts/edge-case-hunter.md` completely and follow it as your review instructions.

claims_file (leave unread until your instructions call for it): {claims_file}

Review content: the unified diff at `{diff_file}`. Read that file — it is the content under review.

READING RULES, THEY ARE NOT OPTIONAL: the diff lives INSIDE the project, under `.build-loop/diffs/`; read it from there with the read tool using offset and limit, in slices of at most 400 lines, and keep going until you have covered it. Never read anything outside the project: a read outside the workspace asks for a permission that nobody grants in an unattended run, and the review hangs waiting for the answer.

Do not invoke any skill, and do not spawn subagents of your own — you are the reviewer. If the instruction file is unreadable, report that exact failure and stop. Return your findings as text in your final message; do not route them through any findings-reporting tool the host may offer.

"""

